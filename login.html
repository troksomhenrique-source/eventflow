<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — EventFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ef-config.js"></script>
<script src="ef-auth.js?v=27"></script>
<style>
  body{margin:0;background:#0a0a0b;font-family:'Inter',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .disp{font-family:'Space Grotesk',sans-serif;}
  input{font-family:'Inter',sans-serif;}
  input::placeholder{color:#4a4a4e;}
  input:focus{outline:none;border-color:#3b82c9 !important;}
  .ef-password-wrap{position:relative;}
  .ef-login-card #senha{padding-right:52px!important;}
  .ef-password-toggle{
    position:absolute;right:2px;top:50%;transform:translateY(-50%);
    width:36px;height:36px;padding:0;border:0;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    background:transparent;color:#6e6e73;cursor:pointer;
    transition:color .15s,background .15s,box-shadow .15s;
  }
  .ef-password-toggle:hover{background:#17181b;color:#b8cfe1;}
  .ef-password-toggle:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(59,130,201,.5);}
  .ef-password-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .ef-password-toggle .eye-off{display:none;}
  .ef-password-toggle[aria-pressed="true"]{color:#7fa8c9!important;background:#121a20;}
  .ef-password-toggle[aria-pressed="true"] .eye-on{display:none;}
  .ef-password-toggle[aria-pressed="true"] .eye-off{display:block;}
</style>
<link rel="stylesheet" href="ef-ui.css">
</head>
<body class="ef-public ef-login">

<div style="width: 100%; min-height: 100vh; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #0a0a0b; color: #f3f1ec; background-image: radial-gradient(ellipse 900px 480px at 50% 0%, rgba(59,130,201,0.10), transparent 70%);">

  <div class="ef-login-card" style="width: 100%; max-width: 380px; padding: 24px; box-sizing: border-box;">

    <!-- brand -->
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 44px; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 18 18" fill="none" style="flex-shrink: 0;"><path d="M2 12c2 0 2-6.5 4-6.5S8 12 10 12s2-6.5 4-6.5" stroke="#7fa8c9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="disp" style="font-weight: 600; font-size: 15px; letter-spacing: -.01em;">EventFlow</div>
    </div>

    <!-- heading -->
    <div style="text-align: center; margin-bottom: 34px;">
      <div class="mono" style="color: #7fa8c9; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 12px;">Pré-produção de eventos</div>
      <h1 class="disp" style="font-size: 24px; font-weight: 600; margin: 0 0 8px; letter-spacing: -.01em;">Acesso ao sistema</h1>
    </div>

    <!-- form -->
    <form id="f" style="display: flex; flex-direction: column; gap: 20px;">
      <div>
        <label class="mono" style="display: block; font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: #6e6e73; margin-bottom: 9px;">E-mail</label>
        <input id="email" type="email" required placeholder="voce@empresa.com" autocomplete="username"
          style="width: 100%; background: transparent; border: none; border-bottom: 1px solid #29292d; color: #f3f1ec; font-size: 14px; padding: 10px 0; outline: none; box-sizing: border-box;">
      </div>

      <div>
        <label class="mono" style="display: block; font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: #6e6e73; margin-bottom: 9px;">Senha</label>
        <div class="ef-password-wrap">
          <input id="senha" type="password" required placeholder="••••••••" autocomplete="current-password"
            style="width: 100%; background: transparent; border: none; border-bottom: 1px solid #29292d; color: #f3f1ec; font-size: 14px; padding: 10px 42px 10px 0; outline: none; box-sizing: border-box;">
          <button id="toggle-senha" type="button" class="ef-password-toggle" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
            <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18"/><path d="M10.7 10.8a2 2 0 0 0 2.5 2.5"/><path d="M9.9 5.7A9.7 9.7 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a16.7 16.7 0 0 1-2.2 3.2"/><path d="M6.5 6.7C3.8 8.7 2.5 12 2.5 12s3.5 6.5 9.5 6.5a9.3 9.3 0 0 0 5.3-1.7"/></svg>
          </button>
        </div>
      </div>

      <button id="btn" type="submit"
        style="margin-top: 10px; width: 100%; border: none; border-radius: 6px; padding: 13px; background: #3b82c9; color: #f3f1ec; font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer;">
        Entrar
      </button>

      <div id="msg" style="min-height: 16px; text-align: center; font-size: 12px; color: #c9695c;"></div>
    </form>

    <div style="margin-top: 30px; padding-top: 18px; border-top: 1px solid #1c1c1f; text-align: center;">
    </div>

  </div>
</div>

<script>
(function () {
  var msg = document.getElementById('msg');
  var btn = document.getElementById('btn');
  var form = document.getElementById('f');
  var toggle = document.getElementById('toggle-senha');
  var senhaInput = document.getElementById('senha');
  toggle.addEventListener('click', function(){
    var show = senhaInput.type === 'password';
    senhaInput.type = show ? 'text' : 'password';
    toggle.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
    toggle.setAttribute('title', show ? 'Ocultar senha' : 'Mostrar senha');
    toggle.setAttribute('aria-pressed', show ? 'true' : 'false');
  });

  document.addEventListener('DOMContentLoaded', async function () {
    if (!window.EF || !EF.ready) return; // ef-auth.js já mostra o aviso de config
    var q = new URLSearchParams(location.search);
    if (q.get('bloqueado')) msg.textContent = 'Este usuário está bloqueado. Fale com o administrador.';

    // já logado? manda pro dashboard
    var r = await EF.client.auth.getUser();
    if (r.data && r.data.user) { location.href = 'dashboard.html'; return; }
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!window.EF || !EF.ready) { msg.textContent = 'Configure ef-config.js primeiro.'; return; }

    btn.disabled = true;
    msg.style.color = '#8c8c91'; msg.textContent = 'Entrando...';

    var email = document.getElementById('email').value.trim();
    var senha = document.getElementById('senha').value;
    var res = await EF.client.auth.signInWithPassword({ email: email, password: senha });

    if (res.error) {
      msg.style.color = '#c9695c'; msg.textContent = 'E-mail ou senha inválidos.';
      btn.disabled = false; return;
    }
    location.href = 'dashboard.html';
  });
})();
</script>

</body>
</html>
