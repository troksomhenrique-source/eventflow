<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRM Comercial — EventFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ef-config.js"></script><script src="ef-auth.js?v=31"></script>
<link rel="stylesheet" href="ef-ui.css?v=31">
<style>
  *{box-sizing:border-box}body{margin:0;background:#0a0a0b;color:#f3f1ec;font-family:Inter,sans-serif}.mono{font-family:'IBM Plex Mono',monospace}.disp{font-family:'Space Grotesk',sans-serif}
  button,input,select,textarea{font:inherit}button{cursor:pointer}.crm-main{min-width:0}.crm-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}.crm-head h1{font:600 28px 'Space Grotesk';margin:0}.sub{color:#77777e;font-size:13px;margin-top:5px}
  .btn{border:1px solid #292b30;border-radius:12px;background:#121316;color:#f3f1ec;padding:11px 14px;font-weight:600}.btn:hover{border-color:#557994}.btn.primary{background:#a9c4d8;color:#071016;border-color:#a9c4d8}.btn.danger{color:#e69a91}.btn.small{padding:8px 10px;font-size:12px}
  .crm-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.field{width:100%;background:#111214;color:#f3f1ec;border:1px solid #25272c;border-radius:11px;padding:11px 12px;min-height:43px}.field:focus{outline:0;border-color:#5c8aad}.crm-tools .field{width:auto;min-width:180px}.crm-tools input{flex:1;min-width:240px}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid #202126;border-radius:14px;overflow:hidden;margin-bottom:18px}.kpi{padding:14px 16px;background:#0e0f11;border-right:1px solid #202126}.kpi:last-child{border:0}.kpi span{font:500 9px 'IBM Plex Mono';letter-spacing:.1em;text-transform:uppercase;color:#686970}.kpi b{display:block;font:600 20px 'Space Grotesk';margin-top:7px}
  .board-wrap{overflow:auto;padding-bottom:12px}.board{display:grid;grid-template-columns:repeat(9,minmax(260px,1fr));gap:12px;min-width:2440px}.column{background:#0e0f11;border:1px solid #202126;border-radius:14px;min-height:500px;padding:11px}.column-head{display:flex;justify-content:space-between;align-items:center;padding:4px 3px 12px}.column-head b{font:600 12px 'Space Grotesk'}.count{font:500 9px 'IBM Plex Mono';color:#7d7e85;background:#17181b;border-radius:999px;padding:4px 7px}
  .cards{display:grid;gap:9px}.lead{background:#131417;border:1px solid #24262b;border-radius:12px;padding:13px;transition:.15s}.lead:hover{border-color:#3b4e5e;transform:translateY(-1px)}.lead-title{font:600 13px 'Space Grotesk';line-height:1.3}.lead-company{font-size:11px;color:#85868c;margin-top:4px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:11px 0}.tag{font:500 8px 'IBM Plex Mono';text-transform:uppercase;letter-spacing:.05em;border-radius:999px;padding:4px 6px;background:#1b1c20;color:#a1a2a8}.tag.quente{background:#38221d;color:#f0a48f}.tag.morno{background:#332e19;color:#ddc572}.tag.frio{background:#172737;color:#8bb8d8}.tag.recorrente{background:#1c3028;color:#8ac4a5}.lead-meta{display:flex;justify-content:space-between;color:#717279;font-size:10px;gap:10px}.lead-next{margin-top:10px;padding-top:10px;border-top:1px solid #222328;color:#aaaab0;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{color:#505158;font-size:11px;text-align:center;padding:28px 8px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;z-index:90;align-items:center;justify-content:center;padding:20px}.overlay.open{display:flex}.modal{width:min(920px,100%);max-height:min(900px,94vh);overflow:auto;background:#0f1012;border:1px solid #292b30;border-radius:18px;padding:20px;box-shadow:0 28px 80px #000}.modal.wide{width:min(1150px,100%)}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}.modal-head h2{font:600 20px 'Space Grotesk';margin:0}.x{background:none;border:0;color:#83848a;font-size:24px;line-height:1}
  .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:13px}.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.label{display:block;font:500 9px 'IBM Plex Mono';text-transform:uppercase;letter-spacing:.08em;color:#74757c;margin-bottom:7px}.textarea{min-height:88px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.msg{font-size:12px;color:#cf8b82;min-height:16px;margin-top:10px}
  .tabs{display:flex;gap:5px;overflow:auto;border-bottom:1px solid #23252a;margin-bottom:18px}.tab{border:0;background:transparent;color:#73747a;padding:10px 11px;white-space:nowrap;font-size:12px}.tab.active{color:#f3f1ec;border-bottom:2px solid #91b5cf}.panel{display:none}.panel.active{display:block}.section-title{font:600 13px 'Space Grotesk';margin:4px 0 14px}.stage-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 18px}.stage-actions .field{width:auto;min-width:210px}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.activity{border-bottom:1px solid #222328;padding:11px 0}.activity:last-child{border:0}.activity strong{font-size:12px}.activity p{font-size:11px;color:#999aa0;margin:5px 0;white-space:pre-wrap}.activity small{font-size:9px;color:#5f6066}.file-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid #23252a;border-radius:10px;padding:10px;margin-top:8px}.file-row b{display:block;font-size:11px}.file-row small{color:#696a71;font-size:9px}.check{display:flex;align-items:center;gap:8px;color:#b7b8bd;font-size:12px;padding-top:14px}.upload{border:1px dashed #34363c;border-radius:12px;padding:13px;margin-bottom:10px}.upload-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.upload-row input[type=file]{max-width:260px;color:#8b8c92;font-size:11px}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(2){border-right:0}.grid .c8,.grid .c6,.grid .c4,.grid .c3{grid-column:span 12}.split{grid-template-columns:1fr}.board{grid-template-columns:repeat(9,82vw);min-width:max-content}.column{min-height:380px}.modal{padding:15px;border-radius:14px}.crm-head{align-items:center}.crm-head .sub{display:none}}
  @media(max-width:540px){.kpis{grid-template-columns:1fr 1fr}.crm-tools .field{width:100%}.crm-tools input{min-width:100%}.overlay{padding:0;align-items:flex-end}.modal{max-height:96vh;border-radius:17px 17px 0 0}.board{grid-template-columns:repeat(9,88vw)}.crm-head h1{font-size:23px}}
</style>
</head>
<body><div class="ef-app-shell"><div></div><main class="crm-main">
  <header class="crm-head"><div><h1>CRM Comercial</h1><div class="sub">Oportunidades, briefing, visita técnica, 3D e fechamento.</div></div><button class="btn primary" id="new-lead">+ Novo lead</button></header>
  <section class="kpis"><div class="kpi"><span>Pipeline aberto</span><b id="k-open">0</b></div><div class="kpi"><span>Valor estimado</span><b id="k-value">R$ 0</b></div><div class="kpi"><span>Leads quentes</span><b id="k-hot">0</b></div><div class="kpi"><span>Ações vencidas</span><b id="k-overdue">0</b></div></section>
  <div class="crm-tools"><input class="field" id="search" type="search" placeholder="Buscar evento, empresa ou contato"><select class="field" id="temperature"><option value="">Todas as temperaturas</option><option value="quente">Quente</option><option value="morno">Morno</option><option value="frio">Frio</option></select><select class="field" id="owner"><option value="">Todos os responsáveis</option></select></div>
  <div class="board-wrap"><div class="board" id="board"></div></div>
</main></div>

<div class="overlay" id="edit-overlay"><div class="modal"><div class="modal-head"><div><h2 id="edit-title">Novo lead</h2><div class="sub">Cadastre a oportunidade e o próximo passo.</div></div><button class="x" data-close="edit-overlay">×</button></div>
<form id="lead-form"><input type="hidden" id="lead-id"><div class="grid">
  <label class="c8"><span class="label">Evento / oportunidade</span><input class="field" id="lead-name" maxlength="180" placeholder="Opcional"></label><label class="c4"><span class="label">Empresa do cliente</span><input class="field" id="lead-company"></label>
  <label class="c4"><span class="label">Contato</span><input class="field" id="contact-name"></label><label class="c4"><span class="label">E-mail</span><input class="field" id="contact-email" type="email"></label><label class="c4"><span class="label">Telefone</span><input class="field" id="contact-phone"></label>
  <label class="c3"><span class="label">Temperatura</span><select class="field" id="lead-temp"><option>frio</option><option selected>morno</option><option>quente</option></select></label><label class="c3"><span class="label">Relacionamento</span><select class="field" id="relationship"><option value="novo">Novo</option><option value="recorrente">Recorrente</option><option value="reativacao">Reativação</option></select></label><label class="c3"><span class="label">Probabilidade %</span><input class="field" id="probability" type="number" min="0" max="100" value="30"></label><label class="c3"><span class="label">Valor estimado</span><input class="field" id="estimated" type="number" min="0" step="0.01"></label>
  <label class="c6"><span class="label">Responsável</span><select class="field" id="responsible"><option value="">Sem responsável</option></select></label><label class="c6"><span class="label">Origem</span><input class="field" id="source" value="indicação"></label>
  <label class="c8"><span class="label">Próxima ação</span><input class="field" id="next-action"></label><label class="c4"><span class="label">Quando</span><input class="field" id="next-date" type="datetime-local"></label>
  <label class="c3"><span class="label">Carga / saída</span><input class="field" id="load-date" type="datetime-local"></label><label class="c3"><span class="label">Início do evento</span><input class="field" id="event-start" type="datetime-local"></label><label class="c3"><span class="label">Fim do evento</span><input class="field" id="event-end" type="datetime-local"></label><label class="c3"><span class="label">Retorno ao estoque</span><input class="field" id="return-date" type="datetime-local"></label>
  <label class="c12"><span class="label">Observações</span><textarea class="field textarea" id="lead-notes"></textarea></label>
</div><div class="msg" id="lead-msg"></div><div class="actions"><button type="button" class="btn" data-close="edit-overlay">Cancelar</button><button class="btn primary">Salvar lead</button></div></form></div></div>

<div class="overlay" id="detail-overlay"><div class="modal wide"><div class="modal-head"><div><h2 id="detail-name">Lead</h2><div class="sub" id="detail-sub"></div></div><button class="x" data-close="detail-overlay">×</button></div>
  <div class="stage-actions"><select class="field" id="stage-select"></select><button class="btn small" id="move-stage">Mover etapa</button><button class="btn small" id="edit-current">Editar dados</button><a class="btn small" id="make-quote" href="vendas.html">Criar orçamento</a></div>
  <div class="tabs" id="tabs"><button class="tab active" data-tab="summary">Resumo</button><button class="tab" data-tab="briefing">Briefing</button><button class="tab" data-tab="visita_tecnica">Visita técnica</button><button class="tab" data-tab="projeto_3d">Projeto 3D</button><button class="tab" data-tab="fechamento_interno">Fechamento</button><button class="tab" data-tab="activities">Atividades</button></div>
  <section class="panel active" id="panel-summary"><div class="split"><div><div class="section-title">Dados comerciais</div><div id="summary-content"></div></div><div><div class="section-title">Linha do tempo</div><div id="timeline"></div></div></div></section>
  <section class="panel" id="panel-briefing"><form id="briefing-form"><div class="grid">
    <label class="c4"><span class="label">Local</span><input class="field" data-brief="local_nome"></label><label class="c8"><span class="label">Endereço</span><input class="field" data-brief="local_endereco"></label><label class="c4"><span class="label">Sala / espaço</span><input class="field" data-brief="sala_nome"></label><label class="c4"><span class="label">Dimensões da sala</span><input class="field" data-brief="sala_dimensoes"></label><label class="c4"><span class="label">Público estimado</span><input class="field" type="number" min="0" data-brief="publico_estimado"></label>
    <label class="c6"><span class="label">Formato do evento</span><input class="field" data-brief="formato_evento"></label><label class="c6"><span class="label">Horários</span><input class="field" data-brief="horarios"></label><label class="c4"><span class="label">Acesso de carga</span><input class="field" data-brief="acesso_carga"></label><label class="c4"><span class="label">Doca</span><input class="field" data-brief="doca"></label><label class="c4"><span class="label">Elevador</span><input class="field" data-brief="elevador"></label>
    <label class="c3 check"><input type="checkbox" data-brief="palco_necessario"> Precisa de palco</label><label class="c4"><span class="label">Dimensões do palco</span><input class="field" data-brief="palco_dimensoes"></label><label class="c5"><span class="label">Empresa do palco</span><input class="field" data-brief="palco_fornecedor"></label><label class="c3 check"><input type="checkbox" data-brief="led_necessario"> Precisa de LED</label><label class="c4"><span class="label">Dimensões do LED</span><input class="field" data-brief="led_dimensoes"></label><label class="c5"><span class="label">Empresa do LED</span><input class="field" data-brief="led_fornecedor"></label>
    <label class="c6"><span class="label">Som</span><textarea class="field textarea" data-brief="sonorizacao"></textarea></label><label class="c6"><span class="label">Luz</span><textarea class="field textarea" data-brief="iluminacao"></textarea></label><label class="c6"><span class="label">Vídeo</span><textarea class="field textarea" data-brief="video"></textarea></label><label class="c6"><span class="label">Cenografia</span><textarea class="field textarea" data-brief="cenografia"></textarea></label><label class="c4"><span class="label">Internet</span><textarea class="field textarea" data-brief="internet"></textarea></label><label class="c4"><span class="label">Energia</span><textarea class="field textarea" data-brief="energia"></textarea></label><label class="c4"><span class="label">Rigging</span><textarea class="field textarea" data-brief="rigging"></textarea></label>
    <label class="c3 check"><input type="checkbox" data-brief="streaming"> Streaming</label><label class="c3 check"><input type="checkbox" data-brief="traducao_simultanea"> Tradução simultânea</label><label class="c6"><span class="label">Contato no local</span><input class="field" data-brief="contato_local"></label><label class="c6"><span class="label">Restrições</span><textarea class="field textarea" data-brief="restricoes"></textarea></label><label class="c6"><span class="label">Observações</span><textarea class="field textarea" data-brief="observacoes"></textarea></label>
  </div><div class="actions"><button class="btn primary">Salvar briefing</button></div></form></section>
  <section class="panel" id="panel-visita_tecnica"><div data-files="visita_tecnica"></div></section>
  <section class="panel" id="panel-projeto_3d"><div data-files="projeto_3d"></div></section>
  <section class="panel" id="panel-fechamento_interno"><div data-files="fechamento_interno"></div></section>
  <section class="panel" id="panel-activities"><form id="activity-form"><div class="grid"><label class="c4"><span class="label">Tipo</span><select class="field" id="activity-type"><option value="nota">Nota</option><option value="tarefa">Tarefa</option><option value="ligacao">Ligação</option><option value="reuniao">Reunião</option><option value="email">E-mail</option></select></label><label class="c8"><span class="label">Título</span><input class="field" id="activity-title" placeholder="Opcional"></label><label class="c8"><span class="label">Descrição</span><textarea class="field textarea" id="activity-desc"></textarea></label><label class="c4"><span class="label">Data e hora</span><input class="field" id="activity-date" type="datetime-local"></label></div><div class="actions"><button type="button" class="btn" id="activity-meet">Agendar com Google Meet</button><button class="btn primary">Adicionar</button></div></form><div id="activities-list" style="margin-top:16px"></div></section>
</div></div>

<script src="ef-ui.js?v=31"></script>
<script>
(function(){
  var STAGES=[['qualificacao','Qualificação'],['briefing','Briefing'],['visita_tecnica','Visita técnica'],['projeto_3d','Projeto 3D'],['fechamento_interno','Fechamento'],['orcamento','Orçamento'],['negociacao','Negociação'],['ganho','Ganho'],['perdido','Perdido']];
  var leads=[],profiles=[],current=null,briefing=null,files=[],activities=[];
  var $=function(s,r){return(r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
  function local(v){if(!v)return'';var d=new Date(v);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
  function date(v){return v?new Date(v).toLocaleDateString('pt-BR'):'—'}
  function labelStage(v){var x=STAGES.find(function(s){return s[0]===v});return x?x[1]:v}
  function nameOf(id){var p=profiles.find(function(x){return x.id===id});return p?(p.nome||p.email):'Sem responsável'}
  function open(id){$('#'+id).classList.add('open')} function close(id){$('#'+id).classList.remove('open')}
  async function init(){if(!window.EF||!EF.ready)return;var ok=await EF.init({crmOnly:true});if(!ok)return;
    $$('.overlay [data-close]').forEach(function(b){b.onclick=function(){close(b.dataset.close)}});$$('.overlay').forEach(function(o){o.addEventListener('click',function(e){if(e.target===o)close(o.id)})});
    STAGES.forEach(function(s){$('#stage-select').insertAdjacentHTML('beforeend','<option value="'+s[0]+'">'+s[1]+'</option>')});
    await loadProfiles();await loadLeads();bind();
  }
  async function loadProfiles(){var r=await EF.client.from('profiles').select('id,nome,email,role').eq('empresa_id',EF.profile.empresa_id).eq('ativo',true).order('nome');profiles=r.data||[];['#owner','#responsible'].forEach(function(sel){profiles.forEach(function(p){$(sel).insertAdjacentHTML('beforeend','<option value="'+p.id+'">'+esc(p.nome||p.email)+'</option>')})})}
  async function loadLeads(){var r=await EF.client.from('crm_leads').select('*').eq('empresa_id',EF.profile.empresa_id).order('updated_at',{ascending:false});if(r.error){alert('Execute a migração REV10 antes de abrir o CRM: '+r.error.message);return}leads=r.data||[];render()}
  function filtered(){var q=$('#search').value.trim().toLowerCase(),t=$('#temperature').value,o=$('#owner').value;return leads.filter(function(l){return(!q||[l.nome_evento,l.empresa_cliente,l.contato_nome].join(' ').toLowerCase().indexOf(q)>=0)&&(!t||l.temperatura===t)&&(!o||l.responsavel_id===o)})}
  function render(){var list=filtered(),html='';STAGES.forEach(function(s){var group=list.filter(function(l){return l.etapa===s[0]});html+='<section class="column"><header class="column-head"><b>'+s[1]+'</b><span class="count">'+group.length+'</span></header><div class="cards">'+(group.map(card).join('')||'<div class="empty">Nenhum lead</div>')+'</div></section>'});$('#board').innerHTML=html;$$('.lead').forEach(function(el){el.onclick=function(){showDetail(el.dataset.id)}});
    var active=leads.filter(function(l){return l.etapa!=='ganho'&&l.etapa!=='perdido'}),now=Date.now();$('#k-open').textContent=active.length;$('#k-value').textContent=money(active.reduce(function(a,l){return a+Number(l.valor_estimado||0)},0));$('#k-hot').textContent=active.filter(function(l){return l.temperatura==='quente'}).length;$('#k-overdue').textContent=active.filter(function(l){return l.proxima_acao_em&&new Date(l.proxima_acao_em).getTime()<now}).length}
  function card(l){return'<article class="lead" data-id="'+l.id+'"><div class="lead-title">'+esc(l.nome_evento)+'</div><div class="lead-company">'+esc(l.empresa_cliente||l.contato_nome||'Contato não informado')+'</div><div class="tags"><span class="tag '+l.temperatura+'">'+esc(l.temperatura)+'</span>'+(l.relacionamento==='recorrente'?'<span class="tag recorrente">recorrente</span>':'')+'<span class="tag">'+l.probabilidade+'%</span></div><div class="lead-meta"><span>'+esc(nameOf(l.responsavel_id))+'</span><b>'+money(l.valor_estimado)+'</b></div>'+(l.proxima_acao?'<div class="lead-next">'+esc(l.proxima_acao)+' · '+date(l.proxima_acao_em)+'</div>':'')+'</article>'}
  function bind(){$('#new-lead').onclick=function(){editLead(null)};['#search','#temperature','#owner'].forEach(function(s){$(s).addEventListener(s==='#search'?'input':'change',render)});$('#lead-form').onsubmit=saveLead;$('#edit-current').onclick=function(){editLead(current)};$('#move-stage').onclick=moveStage;$('#briefing-form').onsubmit=saveBriefing;$('#activity-form').onsubmit=saveActivity;$('#activity-meet').onclick=function(){saveActivity(null,true)};$('#tabs').onclick=function(e){var b=e.target.closest('[data-tab]');if(!b)return;activateTab(b.dataset.tab)};$$('[data-files]').forEach(renderFileShell)}
  function editLead(l){l=l||{};$('#edit-title').textContent=l.id?'Editar lead':'Novo lead';$('#lead-id').value=l.id||'';$('#lead-name').value=l.nome_evento||'';$('#lead-company').value=l.empresa_cliente||'';$('#contact-name').value=l.contato_nome||'';$('#contact-email').value=l.contato_email||'';$('#contact-phone').value=l.contato_telefone||'';$('#lead-temp').value=l.temperatura||'morno';$('#relationship').value=l.relacionamento||'novo';$('#probability').value=l.probabilidade==null?30:l.probabilidade;$('#estimated').value=l.valor_estimado||'';$('#responsible').value=l.responsavel_id||'';$('#source').value=l.origem||'indicação';$('#next-action').value=l.proxima_acao||'';$('#next-date').value=local(l.proxima_acao_em);$('#load-date').value=local(l.carga_inicio);$('#event-start').value=local(l.evento_inicio);$('#event-end').value=local(l.evento_fim);$('#return-date').value=local(l.retorno_previsto);$('#lead-notes').value=l.observacoes||'';$('#lead-msg').textContent='';open('edit-overlay')}
  async function saveLead(e){e.preventDefault();var id=$('#lead-id').value,autoName=$('#lead-name').value.trim()||$('#lead-company').value.trim()||$('#contact-name').value.trim()||'Lead sem título',p={empresa_id:EF.profile.empresa_id,nome_evento:autoName,empresa_cliente:$('#lead-company').value.trim(),contato_nome:$('#contact-name').value.trim(),contato_email:$('#contact-email').value.trim(),contato_telefone:$('#contact-phone').value.trim(),temperatura:$('#lead-temp').value,relacionamento:$('#relationship').value,probabilidade:Number($('#probability').value||0),valor_estimado:Number($('#estimated').value||0),responsavel_id:$('#responsible').value||null,origem:$('#source').value.trim(),proxima_acao:$('#next-action').value.trim(),proxima_acao_em:$('#next-date').value||null,carga_inicio:$('#load-date').value||null,evento_inicio:$('#event-start').value||null,evento_fim:$('#event-end').value||null,retorno_previsto:$('#return-date').value||null,observacoes:$('#lead-notes').value.trim()};if(!id)p.criado_por=EF.user.id;var r=id?await EF.client.from('crm_leads').update(p).eq('id',id):await EF.client.from('crm_leads').insert(p);if(r.error){$('#lead-msg').textContent=r.error.message;return}close('edit-overlay');await loadLeads();if(id&&current){current=leads.find(function(x){return x.id===id});await showDetail(id)}}
  async function showDetail(id){current=leads.find(function(l){return l.id===id});if(!current)return;$('#detail-name').textContent=current.nome_evento;$('#detail-sub').textContent=[current.empresa_cliente,current.contato_nome].filter(Boolean).join(' · ');$('#stage-select').value=current.etapa;$('#make-quote').href='vendas.html?lead='+current.id;$('#summary-content').innerHTML='<div class="grid"><div class="c6"><span class="label">Contato</span>'+esc(current.contato_nome||'—')+'<div class="sub">'+esc(current.contato_email||current.contato_telefone||'')+'</div></div><div class="c6"><span class="label">Responsável</span>'+esc(nameOf(current.responsavel_id))+'</div><div class="c4"><span class="label">Valor</span>'+money(current.valor_estimado)+'</div><div class="c4"><span class="label">Evento</span>'+date(current.evento_inicio)+'</div><div class="c4"><span class="label">Retorno</span>'+date(current.retorno_previsto)+'</div><div class="c12"><span class="label">Observações</span><div class="sub">'+esc(current.observacoes||'—')+'</div></div></div>';await Promise.all([loadBriefing(),loadFiles(),loadActivities()]);activateTab('summary');open('detail-overlay')}
  async function moveStage(){var s=$('#stage-select').value,r=await EF.client.rpc('crm_avancar_etapa',{p_lead_id:current.id,p_etapa:s});if(r.error){alert(r.error.message);return}await loadLeads();current=leads.find(function(x){return x.id===current.id});await loadActivities();$('#detail-name').textContent=current.nome_evento}
  function activateTab(tab){$$('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab)});$$('.panel').forEach(function(p){p.classList.toggle('active',p.id==='panel-'+tab)});if(['visita_tecnica','projeto_3d','fechamento_interno'].indexOf(tab)>=0)renderFiles(tab)}
  async function loadBriefing(){var r=await EF.client.from('crm_briefings').select('*').eq('lead_id',current.id).maybeSingle();briefing=r.data||{};$$('[data-brief]').forEach(function(el){var v=briefing[el.dataset.brief];if(el.type==='checkbox')el.checked=!!v;else el.value=v==null?'':v})}
  async function saveBriefing(e){e.preventDefault();var p={lead_id:current.id,empresa_id:EF.profile.empresa_id,atualizado_por:EF.user.id};$$('[data-brief]').forEach(function(el){p[el.dataset.brief]=el.type==='checkbox'?el.checked:(el.type==='number'?(el.value?Number(el.value):null):el.value.trim())});var r=await EF.client.from('crm_briefings').upsert(p,{onConflict:'lead_id'});if(r.error)alert(r.error.message);else alert('Briefing salvo.')}
  async function loadFiles(){var r=await EF.client.from('crm_arquivos').select('*').eq('lead_id',current.id).order('created_at',{ascending:false});files=r.data||[];['visita_tecnica','projeto_3d','fechamento_interno'].forEach(renderFiles)}
  function renderFileShell(el){var stage=el.dataset.files;el.innerHTML='<div class="upload"><div class="label">Arquivos, imagens e documentos</div><div class="upload-row"><input type="file" id="file-'+stage+'" multiple><input class="field" id="desc-'+stage+'" placeholder="Descrição do arquivo" style="flex:1;min-width:200px"><button class="btn small" type="button" data-upload="'+stage+'">Enviar</button></div></div><div id="files-'+stage+'"></div>';el.querySelector('[data-upload]').onclick=function(){uploadFiles(stage)}}
  function renderFiles(stage){var box=$('#files-'+stage);if(!box)return;var list=files.filter(function(f){return f.etapa===stage});box.innerHTML=list.map(function(f){return'<div class="file-row"><div><b>'+esc(f.nome_original)+'</b><small>'+esc(f.descricao||'Sem descrição')+' · '+Math.ceil(Number(f.tamanho_bytes||0)/1024)+' KB</small></div><div><button class="btn small" data-open-file="'+f.id+'">Abrir</button> <button class="btn small danger" data-delete-file="'+f.id+'">Excluir</button></div></div>'}).join('')||'<div class="empty">Nenhum arquivo nesta etapa.</div>';$$('[data-open-file]',box).forEach(function(b){b.onclick=function(){openFile(b.dataset.openFile)}});$$('[data-delete-file]',box).forEach(function(b){b.onclick=function(){deleteFile(b.dataset.deleteFile)}})}
  async function uploadFiles(stage){var input=$('#file-'+stage),desc=$('#desc-'+stage).value.trim();if(!input.files.length)return;for(var i=0;i<input.files.length;i++){var f=input.files[i];if(f.size>52428800){alert(f.name+' ultrapassa 50 MB.');continue}var safe=f.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]/g,'-'),path=EF.profile.empresa_id+'/'+current.id+'/'+stage+'/'+Date.now()+'-'+i+'-'+safe;var up=await EF.client.storage.from('eventflow-crm').upload(path,f);if(up.error){alert(up.error.message);continue}var row=await EF.client.from('crm_arquivos').insert({empresa_id:EF.profile.empresa_id,lead_id:current.id,etapa:stage,path:path,nome_original:f.name,mime_type:f.type||'application/octet-stream',tamanho_bytes:f.size,descricao:desc,criado_por:EF.user.id});if(row.error){await EF.client.storage.from('eventflow-crm').remove([path]);alert(row.error.message)}}input.value='';$('#desc-'+stage).value='';await loadFiles()}
  async function openFile(id){var f=files.find(function(x){return x.id===id});if(!f)return;var r=await EF.client.storage.from('eventflow-crm').createSignedUrl(f.path,120);if(r.error)alert(r.error.message);else window.open(r.data.signedUrl,'_blank','noopener')}
  async function deleteFile(id){var f=files.find(function(x){return x.id===id});if(!f||!confirm('Excluir este arquivo?'))return;var r=await EF.client.from('crm_arquivos').delete().eq('id',id);if(r.error){alert(r.error.message);return}await EF.client.storage.from('eventflow-crm').remove([f.path]);await loadFiles()}
  async function loadActivities(){var r=await EF.client.from('crm_atividades').select('*').eq('lead_id',current.id).order('created_at',{ascending:false});activities=r.data||[];var html=activities.map(function(a){return'<div class="activity"><strong>'+esc(a.titulo||labelStage(a.tipo))+'</strong><p>'+esc(a.descricao||'')+'</p><small>'+new Date(a.created_at).toLocaleString('pt-BR')+(a.agendada_para?' · agendada '+new Date(a.agendada_para).toLocaleString('pt-BR'):'')+(a.meet_url?' · <a href="'+esc(a.meet_url)+'" target="_blank" rel="noopener">abrir Meet</a>':'')+'</small></div>'}).join('')||'<div class="empty">Nenhuma atividade.</div>';$('#activities-list').innerHTML=html;$('#timeline').innerHTML=html}
  async function saveActivity(e,meet){if(e)e.preventDefault();var title=$('#activity-title').value.trim()||($('#activity-type').value==='tarefa'?'Nova tarefa':'Nova atividade');if(meet){var start=$('#activity-date').value||new Date(Date.now()+5*60000).toISOString();var result=await callGoogle({action:'create_meeting',lead_id:current.id,title:title,description:$('#activity-desc').value.trim(),start:start});if(!result)return;$('#activity-form').reset();await loadActivities();return}var r=await EF.client.from('crm_atividades').insert({empresa_id:EF.profile.empresa_id,lead_id:current.id,autor_id:EF.user.id,tipo:$('#activity-type').value,titulo:title,descricao:$('#activity-desc').value.trim(),agendada_para:$('#activity-date').value||null});if(r.error)alert(r.error.message);else{$('#activity-form').reset();await loadActivities()}}
  async function callGoogle(body){var s=await EF.client.auth.getSession(),token=s.data.session&&s.data.session.access_token;if(!token)return null;var r=await fetch(EF_CONFIG.url+'/functions/v1/google-calendar',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':EF_CONFIG.anonKey},body:JSON.stringify(body)}),out=await r.json().catch(function(){return{}});if(r.status===409&&out.connect_url){if(confirm('Conecte sua conta Google para criar o Meet. Abrir conexão agora?'))location.href=out.connect_url;return null}if(!r.ok){alert(out.error||'Não foi possível criar a reunião.');return null}if(out.meet_url)window.open(out.meet_url,'_blank','noopener');return out}
  document.addEventListener('DOMContentLoaded',init);
})();
</script></body></html>
