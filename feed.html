<style>

.feed-tools{display:flex;gap:9px;align-items:center;margin:0 0 13px}.feed-search{flex:1}.feed-list{display:grid;gap:13px}.post{padding:16px}.post.pinned{border-color:#3c5668;box-shadow:inset 3px 0 #87abc4}.post-head{display:flex;gap:10px;align-items:flex-start}.avatar{width:38px;height:38px;border-radius:50%;background:#1f3546;color:#badaef;display:grid;place-items:center;font:600 11px 'Space Grotesk';flex:0 0 auto}.post-who{min-width:0;flex:1}.post-who b{font:600 13px 'Space Grotesk'}.post-who small{display:block;color:#696b72;font-size:9px;margin-top:3px}.post-menu{display:flex;gap:8px}.icon-btn{border:0;background:transparent;color:#606269;font-size:11px;cursor:pointer;padding:2px}.icon-btn:hover{color:#b9d1e1}.type{display:inline-flex;margin:13px 0 8px;border-radius:999px;padding:4px 7px;background:#17232c;color:#8eb5d0;font:500 8px 'IBM Plex Mono';letter-spacing:.07em;text-transform:uppercase}.type.aviso{background:#33271c;color:#e1b36e}.type.tarefa{background:#27223a;color:#b9a3e3}.type.evento{background:#183127;color:#91c5a5}.post h2{font:600 16px 'Space Grotesk';margin:0 0 7px}.post-copy{font-size:12.5px;line-height:1.58;color:#c5c5c9;white-space:pre-wrap}.linked{margin-top:12px;border:1px solid #25272c;background:#0d0e10;border-radius:11px;padding:10px 12px;color:#aeb0b5;font-size:11px}.linked b{color:#f0eee9}.attachments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:11px}.attachment{border:1px solid #25272c;border-radius:10px;overflow:hidden;background:#0d0e10;cursor:pointer}.attachment img{width:100%;height:170px;object-fit:cover;display:block}.attachment span{display:block;padding:9px;color:#9ea0a6;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.post-actions{display:flex;align-items:center;gap:16px;border-top:1px solid #222328;margin-top:14px;padding-top:11px}.post-action{border:0;background:transparent;color:#777980;font-size:10px;cursor:pointer;padding:0}.post-action.active{color:#92bad5}.comments{margin-top:11px}.comment{display:flex;gap:8px;padding:7px 0}.comment .avatar{width:27px;height:27px;font-size:8px}.comment-copy{background:#151619;border-radius:10px;padding:8px 10px;flex:1;font-size:10.5px;color:#b8b9bd}.comment-copy b{display:block;color:#ededed;font-size:10px;margin-bottom:3px}.comment-form{display:flex;gap:7px;margin-top:8px}.comment-input{flex:1;min-width:0;background:#0d0e10;border:1px solid #25272c;border-radius:999px;color:#f3f1ec;padding:9px 12px;font-size:11px}.empty{border:1px dashed #292b30;border-radius:14px;padding:36px;text-align:center;color:#676970;font-size:12px}
.feed-side{display:grid;gap:12px;position:sticky;top:18px}.side-card{padding:14px}.side-title{font:600 13px 'Space Grotesk';margin-bottom:12px;display:flex;justify-content:space-between}.side-item{display:grid;grid-template-columns:38px 1fr;gap:9px;padding:9px 0;border-bottom:1px solid #202126}.side-item:last-child{border:0}.date-box{border:1px solid #34556c;border-radius:8px;color:#a9cce2;text-align:center;padding:4px 2px;font:600 11px 'Space Grotesk'}.date-box small{display:block;font:500 7px 'IBM Plex Mono';text-transform:uppercase}.side-item b{font-size:11px;display:block}.side-item span{font-size:9px;color:#74767c;display:block;margin-top:3px}.progress{height:5px;background:#23252a;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:#8db6d1;border-radius:99px}.side-count{font:600 22px 'Space Grotesk';margin-top:6px}
@media(max-width:1050px){.feed-layout{grid-template-columns:1fr}.feed-side{position:static;grid-template-columns:1fr 1fr}.feed-main{max-width:none}}@media(max-width:680px){.feed-head h1{font-size:22px}.feed-layout{display:block}.feed-side{display:grid;grid-template-columns:1fr;margin-top:14px}.composer-links{grid-template-columns:1fr}.post{padding:13px;border-radius:12px}.attachments{grid-template-columns:1fr}.attachment img{height:190px}.composer-tab{padding:12px 11px}.feed-tools{align-items:stretch}.post-menu{gap:3px}}
</style></head><body><div class="ef-app-shell"><div></div><main class="feed-page">
<header class="feed-head"><div><h1>Feed</h1><div class="sub">Atualizações, comunicados e colaboração da equipe.</div></div></header>
<div class="feed-layout"><section class="feed-main">
  <div class="composer"><div class="composer-tabs"><button class="composer-tab active" data-type="mensagem">Mensagem</button><button class="composer-tab" data-type="aviso">Aviso</button><button class="composer-tab" data-type="tarefa">Tarefa</button><button class="composer-tab" data-type="evento">Evento</button></div><div class="composer-body"><input id="post-title" class="composer-title" placeholder="Título opcional"><textarea id="post-content" class="composer-text" placeholder="Compartilhe uma atualização com a equipe..."></textarea><div class="composer-links"><select id="post-event" class="select"><option value="">Vincular evento</option></select><select id="post-task" class="select"><option value="">Vincular tarefa</option></select><select id="post-lead" class="select"><option value="">Vincular lead</option></select></div><div class="composer-footer"><label class="file-label">📎 Anexar arquivos <input id="post-files" type="file" multiple hidden></label><div><span id="post-msg" class="msg"></span> <button id="publish" class="btn primary">Publicar</button></div></div></div></div>
  <div class="feed-tools"><input id="feed-search" class="feed-search" type="search" placeholder="Pesquisar no feed"><select id="feed-filter" class="select" style="width:auto"><option value="">Tudo</option><option value="mensagem">Mensagens</option><option value="aviso">Avisos</option><option value="tarefa">Tarefas</option><option value="evento">Eventos</option></select></div>
  <div id="feed-list" class="feed-list"></div>
</section><aside class="feed-side"><div class="side-card"><div class="side-title"><span>Próximos eventos</span><a href="agenda.html" style="color:#8eb5d0;text-decoration:none">+</a></div><div id="upcoming"></div></div><div class="side-card"><div class="side-title"><span>Minhas tarefas</span><a href="notas.html" style="color:#8eb5d0;text-decoration:none">+</a></div><div class="side-count" id="my-count">0</div><div class="sub" id="my-copy">nenhuma pendente</div><div class="progress"><i id="my-progress" style="width:0%"></i></div><div id="my-tasks" style="margin-top:8px"></div></div></aside></div>
</main></div><script src="ef-ui.js?v=32"></script><script>
(function(){
var posts=[],comments=[],reactions=[],attachments=[],profiles=[],events=[],tasks=[],leads=[],type='mensagem';var $=function(s,r){return(r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function initials(v){return String(v||'?').split(/\s+/).filter(Boolean).slice(0,2).map(function(x){return x[0].toUpperCase()}).join('')}function name(id){var p=profiles.find(function(x){return x.id===id});return p?(p.nome||p.email):'EventFlow'}function ago(v){var n=(Date.now()-new Date(v))/1000;if(n<60)return'agora';if(n<3600)return Math.floor(n/60)+' min';if(n<86400)return Math.floor(n/3600)+' h';return new Date(v).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}function ref(list,id,field){var x=list.find(function(v){return v.id===id});return x?x[field]:''}
async function init(){if(!window.EF||!EF.ready)return;var ok=await EF.init({});if(!ok)return;bind();await loadRefs();await loadAll();subscribe()}
function bind(){$$('.composer-tab').forEach(function(b){b.onclick=function(){$$('.composer-tab').forEach(function(x){x.classList.toggle('active',x===b)});type=b.dataset.type;$('#post-content').placeholder=type==='aviso'?'Escreva um comunicado importante...':type==='tarefa'?'Comente sobre uma tarefa...':type==='evento'?'Compartilhe uma atualização do evento...':'Compartilhe uma atualização com a equipe...'}});$('#publish').onclick=publish;$('#feed-search').oninput=render;$('#feed-filter').onchange=render}
async function loadRefs(){var e=EF.profile.empresa_id,r=await Promise.all([EF.client.from('profiles').select('id,nome,email').eq('empresa_id',e).eq('ativo',true),EF.client.from('eventos').select('id,nome,data_inicio,local,status').eq('empresa_id',e).order('data_inicio',{ascending:true}),EF.client.from('tarefas').select('*').eq('empresa_id',e).order('created_at',{ascending:false}),EF.client.from('crm_leads').select('id,nome_evento').eq('empresa_id',e).order('updated_at',{ascending:false})]);profiles=r[0].data||[];events=r[1].data||[];tasks=r[2].data||[];leads=r[3].data||[];events.forEach(function(x){option('post-event',x.id,x.nome)});tasks.filter(function(x){return!x.concluida}).forEach(function(x){option('post-task',x.id,x.texto||'Nova tarefa')});leads.forEach(function(x){option('post-lead',x.id,x.nome_evento)});renderSide()}
function option(id,v,t){var o=document.createElement('option');o.value=v;o.textContent=t;$('#'+id).appendChild(o)}
async function loadAll(){var e=EF.profile.empresa_id,r=await Promise.all([EF.client.from('comunicacao_posts').select('*').eq('empresa_id',e).order('fixado',{ascending:false}).order('created_at',{ascending:false}),EF.client.from('comunicacao_comentarios').select('*').eq('empresa_id',e).order('created_at'),EF.client.from('comunicacao_reacoes').select('*').eq('empresa_id',e),EF.client.from('comunicacao_anexos').select('*').eq('empresa_id',e)]);if(r[0].error){$('#feed-list').innerHTML='<div class="empty">Execute a migração REV12 para ativar o Feed.<br>'+esc(r[0].error.message)+'</div>';return}posts=r[0].data||[];comments=r[1].data||[];reactions=r[2].data||[];attachments=r[3].data||[];render()}
async function publish(){var btn=$('#publish'),content=$('#post-content').value.trim(),title=$('#post-title').value.trim();btn.disabled=true;$('#post-msg').textContent='Publicando...';var r=await EF.client.from('comunicacao_posts').insert({empresa_id:EF.profile.empresa_id,autor_id:EF.user.id,tipo:type,titulo:title,conteudo:content||'Nova publicação',evento_id:$('#post-event').value||null,tarefa_id:$('#post-task').value||null,lead_id:$('#post-lead').value||null}).select().single();if(r.error){$('#post-msg').textContent=r.error.message;btn.disabled=false;return}var files=$('#post-files').files;for(var i=0;i<files.length;i++)await upload(r.data,files[i],i);$('#post-title').value='';$('#post-content').value='';$('#post-files').value='';$('#post-event').value='';$('#post-task').value='';$('#post-lead').value='';$('#post-msg').textContent='Publicado ✓';btn.disabled=false;await loadAll();setTimeout(function(){$('#post-msg').textContent=''},1500)}
async function upload(post,file,i){if(file.size>52428800)return;var safe=file.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]/g,'-'),path=EF.profile.empresa_id+'/'+post.id+'/'+Date.now()+'-'+i+'-'+safe,up=await EF.client.storage.from('eventflow-feed').upload(path,file);if(!up.error)await EF.client.from('comunicacao_anexos').insert({post_id:post.id,empresa_id:EF.profile.empresa_id,path:path,nome_original:file.name,mime_type:file.type||'application/octet-stream',tamanho_bytes:file.size,criado_por:EF.user.id})}
function render(){var q=$('#feed-search').value.toLowerCase(),f=$('#feed-filter').value,list=posts.filter(function(p){return(!f||p.tipo===f)&&(!q||(p.titulo+' '+p.conteudo+' '+name(p.autor_id)).toLowerCase().indexOf(q)>=0)});$('#feed-list').innerHTML=list.map(card).join('')||'<div class="empty">Nenhuma publicação encontrada.</div>';$$('[data-like]').forEach(function(b){b.onclick=function(){react(b.dataset.like)}});$$('[data-comment]').forEach(function(b){b.onclick=function(){addComment(b.dataset.comment)}});$$('[data-pin]').forEach(function(b){b.onclick=function(){pin(b.dataset.pin)}});$$('[data-delete]').forEach(function(b){b.onclick=function(){removePost(b.dataset.delete)}});$$('[data-file]').forEach(function(b){b.onclick=function(){openFile(b.dataset.file)}})}
function card(p){var cs=comments.filter(function(c){return c.post_id===p.id}),rs=reactions.filter(function(r){return r.post_id===p.id}),mine=rs.some(function(r){return r.profile_id===EF.user.id}),as=attachments.filter(function(a){return a.post_id===p.id}),linked='';if(p.evento_id)linked='<div class="linked"><b>Evento</b> · '+esc(ref(events,p.evento_id,'nome'))+'</div>';if(p.tarefa_id)linked='<div class="linked"><b>Tarefa</b> · '+esc(ref(tasks,p.tarefa_id,'texto'))+'</div>';if(p.lead_id)linked+='<div class="linked"><b>Lead</b> · '+esc(ref(leads,p.lead_id,'nome_evento'))+'</div>';return'<article class="post '+(p.fixado?'pinned':'')+'"><div class="post-head"><div class="avatar">'+initials(name(p.autor_id))+'</div><div class="post-who"><b>'+esc(name(p.autor_id))+'</b><small>'+ago(p.created_at)+(p.sistema?' · atualização automática':'')+'</small></div><div class="post-menu">'+((p.autor_id===EF.user.id||EF.isGerencia())?'<button class="icon-btn" data-pin="'+p.id+'">'+(p.fixado?'desfixar':'fixar')+'</button><button class="icon-btn" data-delete="'+p.id+'">excluir</button>':'')+'</div></div><span class="type '+p.tipo+'">'+esc(p.tipo)+'</span>'+(p.titulo?'<h2>'+esc(p.titulo)+'</h2>':'')+'<div class="post-copy">'+esc(p.conteudo)+'</div>'+linked+fileHtml(as)+'<div class="post-actions"><button class="post-action '+(mine?'active':'')+'" data-like="'+p.id+'">♥ '+rs.length+'</button><button class="post-action" onclick="document.getElementById(\'comment-'+p.id+'\').focus()">Comentar · '+cs.length+'</button></div><div class="comments">'+cs.map(commentHtml).join('')+'<div class="comment-form"><input class="comment-input" id="comment-'+p.id+'" placeholder="Adicionar comentário"><button class="btn" data-comment="'+p.id+'">Enviar</button></div></div></article>'}
function commentHtml(c){return'<div class="comment"><div class="avatar">'+initials(name(c.autor_id))+'</div><div class="comment-copy"><b>'+esc(name(c.autor_id))+'</b>'+esc(c.conteudo)+'</div></div>'}
function fileHtml(as){return as.length?'<div class="attachments">'+as.map(function(a){var image=/^image\//.test(a.mime_type);return'<div class="attachment" data-file="'+a.id+'">'+(image?'<img data-feed-img="'+a.id+'" alt="'+esc(a.nome_original)+'">':'')+'<span>📎 '+esc(a.nome_original)+'</span></div>'}).join('')+'</div>':''}
async function hydrateImages(){var imgs=$$('[data-feed-img]');for(var i=0;i<imgs.length;i++){var a=attachments.find(function(x){return x.id===imgs[i].dataset.feedImg});if(!a)continue;var r=await EF.client.storage.from('eventflow-feed').createSignedUrl(a.path,600);if(r.data)imgs[i].src=r.data.signedUrl}}
var oldRender=render;render=function(){oldRender();hydrateImages()};
async function addComment(id){var input=$('#comment-'+id),v=input.value.trim()||'Comentário';var r=await EF.client.from('comunicacao_comentarios').insert({post_id:id,empresa_id:EF.profile.empresa_id,autor_id:EF.user.id,conteudo:v});if(!r.error){input.value='';await loadAll()}}
async function react(id){var mine=reactions.find(function(r){return r.post_id===id&&r.profile_id===EF.user.id});if(mine)await EF.client.from('comunicacao_reacoes').delete().eq('post_id',id).eq('profile_id',EF.user.id);else await EF.client.from('comunicacao_reacoes').insert({post_id:id,empresa_id:EF.profile.empresa_id,profile_id:EF.user.id,reacao:'curtir'});await loadAll()}
async function pin(id){var p=posts.find(function(x){return x.id===id});if(p){await EF.client.from('comunicacao_posts').update({fixado:!p.fixado}).eq('id',id);await loadAll()}}async function removePost(id){if(!confirm('Excluir esta publicação?'))return;var paths=attachments.filter(function(a){return a.post_id===id}).map(function(a){return a.path});if(paths.length)await EF.client.storage.from('eventflow-feed').remove(paths);var r=await EF.client.from('comunicacao_posts').delete().eq('id',id);if(r.error)alert(r.error.message);await loadAll()}async function openFile(id){var a=attachments.find(function(x){return x.id===id});if(!a)return;var r=await EF.client.storage.from('eventflow-feed').createSignedUrl(a.path,120);if(r.data)window.open(r.data.signedUrl,'_blank','noopener')}
function renderSide(){var now=new Date(),future=events.filter(function(e){return new Date(e.data_inicio)>=new Date(now.getFullYear(),now.getMonth(),now.getDate())&&e.status!=='cancelado'}).slice(0,5);$('#upcoming').innerHTML=future.map(function(e){var d=new Date(e.data_inicio);return'<div class="side-item"><div class="date-box"><small>'+d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')+'</small>'+d.getDate()+'</div><div><b>'+esc(e.nome)+'</b><span>'+d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+(e.local?' · '+esc(e.local):'')+'</span></div></div>'}).join('')||'<div class="sub">Nenhum evento próximo.</div>';var mine=tasks.filter(function(t){return!t.concluida&&(!t.responsavel_id||t.responsavel_id===EF.user.id)}),done=tasks.filter(function(t){return t.concluida&&t.responsavel_id===EF.user.id}).length,total=mine.length+done;$('#my-count').textContent=mine.length;$('#my-copy').textContent=mine.length===1?'tarefa pendente':'tarefas pendentes';$('#my-progress').style.width=(total?Math.round(done/total*100):0)+'%';$('#my-tasks').innerHTML=mine.slice(0,4).map(function(t){return'<div class="side-item" style="grid-template-columns:1fr"><div><b>'+esc(t.texto||'Nova tarefa')+'</b><span>'+(t.prazo?'prazo '+new Date(t.prazo+'T12:00:00').toLocaleDateString('pt-BR'):'sem prazo')+'</span></div></div>'}).join('')}
function subscribe(){EF.client.channel('feed-'+EF.profile.empresa_id).on('postgres_changes',{event:'*',schema:'public',table:'comunicacao_posts',filter:'empresa_id=eq.'+EF.profile.empresa_id},loadAll).on('postgres_changes',{event:'INSERT',schema:'public',table:'comunicacao_comentarios',filter:'empresa_id=eq.'+EF.profile.empresa_id},loadAll).subscribe()}
document.addEventListener('DOMContentLoaded',init);
})();
</script></body></html>
